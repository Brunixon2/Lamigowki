<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="color-scheme" content="dark">
<title>Łamigłówki itp.</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#09090b;color:#f4f4f5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100dvh}
.screen{min-height:100dvh;width:100%;padding:max(22px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));}
#loginScreen{display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:460px;margin:auto}
.logo{display:block;width:122px;height:122px;object-fit:contain;margin:0 auto 18px;image-rendering:pixelated;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s}
.logo.pop{transform:scale(1.22);opacity:.92}
h1{font-size:36px;line-height:1.05;text-align:center;margin:0 0 10px}
.sub{text-align:center;color:#a1a1aa;margin:0 0 30px}
label{display:block;font-size:14px;font-weight:750;margin:18px 0 8px}
input{width:100%;height:56px;border:1px solid #34343a;border-radius:12px;background:#17171b;color:white;padding:0 15px;font-size:18px;outline:none}
input:focus{border-color:#71717a}
button{width:100%;height:56px;border:0;border-radius:12px;font-size:17px;font-weight:800;cursor:pointer}
.primary{background:#f4f4f5;color:#111113;margin-top:24px}
.error{min-height:22px;text-align:center;color:#fb7185;margin-top:14px;font-size:14px}
#homeScreen{display:none;overflow:auto}
.home{width:100%;max-width:520px;margin:0 auto;padding-bottom:24px}
.homeTop{text-align:center;padding-top:8px}
.homeTop .logo{width:100px;height:100px;margin-bottom:8px}
.homeTop h2{font-size:28px;margin:0 0 5px}
.welcome{color:#a1a1aa;margin:0 0 22px}
.card{background:#151518;border:1px solid #29292e;border-radius:16px;padding:16px;margin:12px 0}
.card h3{margin:0 0 12px;font-size:17px}
.hostButton{background:#3f3f46;color:#fff;margin-bottom:12px}
.gameRow{display:flex;gap:9px}
.gameRow input{flex:1;min-width:0}
.gameRow button{width:116px;background:#f4f4f5;color:#111113}
.gameCode{font-family:monospace;font-size:25px;letter-spacing:3px;font-weight:800;margin:5px 0 13px}
.hidden{display:none!important}
.playerList{list-style:none;padding:0;margin:0}
.playerList li{padding:11px 3px;border-bottom:1px solid #29292e;display:flex;align-items:center;gap:9px}
.playerList li:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:2px;background:#71717a;flex:none}
.note{color:#8b8b93;font-size:12px;line-height:1.4;margin-top:10px}
</style>
</head>
<body>
<section id="loginScreen" class="screen">
  <div class="wrap">
    <img id="loginLogo" class="logo" src="assets/icon.png" alt="Łamigłówki itp.">
    <h1>Łamigłówki itp.</h1>
    <p class="sub">Zaloguj się swoim loginem i pinem podanym na kartce</p>
    <form id="loginForm">
      <label for="login">Login</label>
      <input id="login" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required>
      <button class="primary" type="submit">Zaloguj się</button>
      <div id="error" class="error"></div>
    </form>
  </div>
</section>

<section id="homeScreen" class="screen">
  <div class="home">
    <div class="homeTop">
      <img class="logo" src="assets/icon.png" alt="">
      <h2>Łamigłówki itp.</h2>
      <p id="welcome" class="welcome"></p>
    </div>

    <div id="hostCard" class="card hidden">
      <h3>Prowadzący</h3>
      <button id="createGame" class="hostButton">Utwórz grę</button>
      <div id="createdGame" class="hidden">
        <div style="color:#a1a1aa;font-size:13px">Kod Gry:</div>
        <div id="createdCode" class="gameCode">----</div>
        <button id="startGame" class="primary" style="margin-top:0">Rozpocznij</button>
      </div>
    </div>

    <div class="card">
      <h3>Dołącz do gry</h3>
      <div class="gameRow">
        <input id="gameCodeInput" inputmode="numeric" maxlength="4" placeholder="Kod Gry">
        <button id="joinGame">Dołącz!</button>
      </div>
    </div>

    <div class="card">
      <h3 id="lobbyTitle">Lista graczy</h3>
      <div id="lobbyStatus" style="color:#a1a1aa;font-size:13px;margin:-5px 0 10px">Nie dołączono do lobby</div>
      <ul id="playerList" class="playerList"></ul>
      <div class="note">Po dołączeniu do gry lista aktualizuje się na żywo.</div>
    </div>
  </div>
</section>



<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getDatabase, ref, set, get, update, onValue, onDisconnect
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCXMWsIgPPjV4pQFonYRJvUNjWa96Z3tE8",
  authDomain: "lamiglowki-60ed9.firebaseapp.com",
  databaseURL: "https://lamiglowki-60ed9-default-rtdb.firebaseio.com",
  projectId: "lamiglowki-60ed9",
  storageBucket: "lamiglowki-60ed9.firebasestorage.app",
  messagingSenderId: "937018489247",
  appId: "1:937018489247:web:08504c87cf08ceb147e5aa",
  measurementId: "G-RF4JC8CCRE"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const USERS = {
  "AdmP": {pin:"4208",name:"Adam Pypla"},
  "AlkK": {pin:"0271",name:"Aleksandra Kaczmarek"},
  "AlcJ": {pin:"9234",name:"Alicja Jarus"},
  "AmlM": {pin:"4400",name:"Amelka Michalak"},
  "ArkL": {pin:"2635",name:"Arek Łeckio"},
  "BarB": {pin:"1369",name:"Barbara Baryga"},
  "BlnS": {pin:"1278",name:"Blanka Sobota"},
  "BrnG": {pin:"1199",name:"Bruno Grędziak",host:true},
  "BrnK": {pin:"7780",name:"Bruno Klause"},
  "EmlS": {pin:"7478",name:"Emilia Skotarek"},
  "GabJ": {pin:"9759",name:"Gabryś Jędrzejewski"},
  "IgrR": {pin:"4673",name:"Igor Rybakowski"},
  "IgrS": {pin:"7554",name:"Igor Szwarc"},
  "JkbD": {pin:"2413",name:"Jakub Dworniczak"},
  "KasK": {pin:"0134",name:"Kasia Kmiecik"},
  "KldJ": {pin:"3797",name:"Klaudia Juskowiak"},
  "KlyL": {pin:"4960",name:"Klymenko Liliia"},
  "LenK": {pin:"5952",name:"Lena Klimek"},
  "MajP": {pin:"1135",name:"Maja Przybył"},
  "MarJ": {pin:"0603",name:"Maria Jarczyńska"},
  "MarW": {pin:"9274",name:"Maria Wujek"},
  "MriB": {pin:"9517",name:"Marianna Bręk"},
  "MrtN": {pin:"3398",name:"Martyna Nogała"},
  "MrtR": {pin:"5778",name:"Martyna Rudyńska"},
  "MlgK": {pin:"8263",name:"Małgosia Krawczyk"},
  "NikP": {pin:"6409",name:"Nikola Pierszchała"},
  "PtrB": {pin:"7795",name:"Patryk Bagiński"},
  "PtrP": {pin:"0854",name:"Patryk Pernak"},
  "SndK": {pin:"0599",name:"Sandra Kowalska"},
  "WikS": {pin:"6600",name:"Wiktoria Straburzyńska"},
  "Oglądający": {pin:"9013",name:"Oglądający",spectator:true}
};

let currentUser = null;
let currentGameCode = null;
let stopLobbyListener = null;

const $ = id => document.getElementById(id);
const loginScreen = $("loginScreen");
const homeScreen = $("homeScreen");
const loginLogo = $("loginLogo");
const error = $("error");

function safeKey(s) {
  return s.replace(/[.#$\[\]\/]/g, "_");
}

function renderLobby(players = {}) {
  const list = $("playerList");
  list.innerHTML = "";

  const entries = Object.values(players);
  entries.sort((a,b) => (a.spectator ? 1 : 0) - (b.spectator ? 1 : 0) || a.name.localeCompare(b.name,"pl"));

  for (const p of entries) {
    const li = document.createElement("li");
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = "#22c55e";

    const name = document.createElement("span");
    name.textContent = p.name + (p.host ? " — Prowadzący" : p.spectator ? " — Oglądający" : "");

    li.append(dot, name);
    list.appendChild(li);
  }

  const playing = entries.filter(p => !p.spectator).length;
  const spectators = entries.filter(p => p.spectator).length;
  $("lobbyTitle").textContent = `Lista graczy (${playing}/30)`;
  $("lobbyStatus").textContent =
    currentGameCode
      ? `Kod Gry: ${currentGameCode}` + (spectators ? ` • Oglądający: ${spectators}` : "")
      : "Nie dołączono do lobby";
}

function listenToLobby(code) {
  currentGameCode = code;
  if (stopLobbyListener) stopLobbyListener();

  const gameRef = ref(db, `games/${code}`);
  stopLobbyListener = onValue(gameRef, snap => {
    if (!snap.exists()) {
      $("lobbyStatus").textContent = "Ta gra już nie istnieje.";
      return;
    }
    const game = snap.val();
    renderLobby(game.players || {});

    if (game.status === "started") {
      $("lobbyStatus").textContent = `Kod Gry: ${code} • Gra rozpoczęta`;
      // Tu później podłączymy ekran pierwszej rundy.
    }
  });
}

async function addCurrentUserToGame(code) {
  const playerRef = ref(db, `games/${code}/players/${safeKey(currentUser.login)}`);
  await set(playerRef, {
    login: currentUser.login,
    name: currentUser.name,
    host: !!currentUser.host,
    spectator: !!currentUser.spectator,
    joinedAt: Date.now()
  });

  // Jeśli telefon zamknie stronę lub straci połączenie, osoba zniknie z lobby.
  try { await onDisconnect(playerRef).remove(); } catch (_) {}
}

async function makeUniqueCode() {
  for (let i = 0; i < 30; i++) {
    const code = String(Math.floor(1000 + Math.random() * 9000));
    const snap = await get(ref(db, `games/${code}`));
    if (!snap.exists()) return code;
  }
  throw new Error("Nie udało się wygenerować wolnego kodu.");
}

$("loginForm").addEventListener("submit", e => {
  e.preventDefault();
  const login = $("login").value.trim();
  const pin = $("pin").value.trim();
  const user = USERS[login];

  if (!user || user.pin !== pin) {
    error.textContent = "Nieprawidłowy login lub PIN.";
    return;
  }

  currentUser = { login, ...user };
  error.textContent = "";
  loginLogo.classList.add("pop");

  setTimeout(() => {
    loginScreen.style.display = "none";
    homeScreen.style.display = "block";
    document.body.style.overflow = "auto";
    $("welcome").textContent = "Zalogowano jako: " + user.name;
    if (user.host) $("hostCard").classList.remove("hidden");
    renderLobby({});
    window.scrollTo(0,0);
  }, 430);
});

$("createGame").addEventListener("click", async () => {
  if (!currentUser?.host) return;
  const btn = $("createGame");
  btn.disabled = true;
  btn.textContent = "Tworzenie...";

  try {
    const code = await makeUniqueCode();
    await set(ref(db, `games/${code}`), {
      code,
      status: "lobby",
      hostLogin: currentUser.login,
      createdAt: Date.now()
    });
    await addCurrentUserToGame(code);

    currentGameCode = code;
    $("createdCode").textContent = code;
    $("createdGame").classList.remove("hidden");
    btn.textContent = "Utwórz nową grę";
    listenToLobby(code);
  } catch (err) {
    console.error(err);
    alert("Nie udało się utworzyć gry. Sprawdź połączenie z Firebase.");
    btn.textContent = "Utwórz grę";
  } finally {
    btn.disabled = false;
  }
});

$("joinGame").addEventListener("click", async () => {
  if (!currentUser) return;

  const code = $("gameCodeInput").value.trim();
  if (!/^\d{4}$/.test(code)) {
    alert("Wpisz 4-cyfrowy Kod Gry.");
    return;
  }

  try {
    const gameSnap = await get(ref(db, `games/${code}`));
    if (!gameSnap.exists()) {
      alert("Nie znaleziono gry o takim kodzie.");
      return;
    }

    const game = gameSnap.val();
    if (game.status !== "lobby") {
      alert("Ta gra już się rozpoczęła.");
      return;
    }

    await addCurrentUserToGame(code);
    listenToLobby(code);
    $("gameCodeInput").value = "";
  } catch (err) {
    console.error(err);
    alert("Nie udało się dołączyć. Sprawdź połączenie z Firebase.");
  }
});

$("startGame").addEventListener("click", async () => {
  if (!currentUser?.host || !currentGameCode) return;

  try {
    await update(ref(db, `games/${currentGameCode}`), {
      status: "started",
      startedAt: Date.now()
    });
  } catch (err) {
    console.error(err);
    alert("Nie udało się rozpocząć gry.");
  }
});
</script>

</body>
</html>
